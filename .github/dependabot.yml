# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    labels:
      - 'automerge'
      - 'dependencies'
    schedule:
      interval: 'daily'
      time: '02:34'
  # Every action in `.github/workflows/` is pinned to a commit SHA, with the
  # release that SHA is named in a comment beside it, so nothing moves unless
  # this moves it: Dependabot bumps the SHA and the `# vN.N.N` comment together.
  - package-ecosystem: 'github-actions'
    directory: '/'
    labels:
      - 'automerge'
      - 'dependencies'
    schedule:
      interval: 'daily'
      time: '02:34'
