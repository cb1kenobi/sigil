name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

# Every job here reads the repository and nothing else: no job comments on a
# pull request, pushes, or uploads anywhere. Saying so means the token is
# read-only whatever the repository's default happens to be.
permissions:
  contents: read

jobs:
  # Whether this run needs the nine-job package matrix below. A pull request
  # that changes only website files does not: no package imports the site, and
  # `scripts/ci-scope.mjs` lists the few website files the package suite does
  # read. A push to `main` always runs everything.
  #
  # The PR is checked out as GitHub's merge commit, whose first parent is the
  # base branch, so `HEAD^1..HEAD` is exactly what the PR changes and a depth of
  # 2 is all the history it needs. `--no-renames` lists both sides of a move, so
  # a file moved from `packages/` into `website/` still counts as a package
  # change. `shell: bash` turns on `pipefail`, so a failed diff fails this job
  # rather than reading as an empty one. The event name is read from the
  # runner's own `GITHUB_EVENT_NAME` rather than written in as `${{ }}`, which
  # would paste it into the script text before bash parses it.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.scope.outputs.packages }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Decide what to test
        id: scope
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --no-renames HEAD^1 HEAD | node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"
          else
            echo "packages=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # `pnpm check` is type-check, lint and *format*, and the format half ran
  # nowhere until an oxfmt bump reformatted markdown and `pnpm check` started
  # failing on clean `main` -- the matrix below had `pnpm lint` and
  # `pnpm type-check` as steps and never `pnpm fmt:check`, so the drift was
  # invisible to all nine jobs. It is one job rather than a tenth step in each,
  # for two reasons: what it checks is a property of the committed *bytes*, so
  # nine answers to it are the same answer, and `oxfmt --check` refuses CRLF --
  # `.gitattributes` says `* text=auto` with `eol=lf` on `*.js` alone, so `.ts`,
  # `.md` and `.yml` check out CRLF on Windows and the check would fail there on
  # every run. Giving every text file `eol=lf` is the other way round it and is
  # a change to what every contributor's working tree looks like, which is not a
  # thing to take inside a CI fix.
  #
  # It runs the whole of `pnpm check` rather than `pnpm fmt:check` alone so that
  # what CI gates on is the one command a contributor runs locally and the
  # pre-commit hook already runs; the lint and type-check it repeats are seconds
  # against the matrix beside it.
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies
        run: pnpm install

      - name: Type check, lint and format check
        run: pnpm check

      # The website's own tests (`website/test/`), which the root `pnpm test`
      # does not reach: it runs vitest over `packages/*`. They import
      # `@ttylabs/sigil` through its `exports`, which point at `dist/`, so the
      # build is named here rather than left to whatever `pnpm check` happened
      # to build on its way. An exact name, so a wrong one fails loudly.
      # Every tracked file, the website's included, checked for raw control
      # characters and NUL bytes. It is the one package test a website-only PR
      # can fail, which SIG-255 did on all nine jobs by adding fonts, and the
      # matrix below does not run for such a PR. It reads committed bytes, so
      # one run answers for every platform.
      - name: Source bytes
        run: pnpm exec vitest run packages/sigil/test/sources.test.ts

      # `@ttylabs/cli` as well, since the home page's capture test runs the built
      # `sigil --help` (`website/test/home-captures.test.ts`) and needs its `dist/`.
      - name: Website tests
        run: pnpm exec turbo run build --filter=@ttylabs/sigil --filter=@ttylabs/cli && pnpm --filter website test

  test:
    name: Test on node ${{ matrix.node }} and ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm coverage

  # TEMPORARY (SIG-356): rehearses publish.yml's artifact hand-off on real
  # runners, with no token and a dry-run publish. Removed in the next commit.
  rehearse-build:
    name: Rehearse publish (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --force
      - run: tar --format=ustar -cf "$RUNNER_TEMP/build-output.tar" packages/*/dist packages/*/registry
      - name: Pack hashes as built
        run: |
          for d in packages/*/; do pnpm -C "$d" pack --pack-destination "$RUNNER_TEMP/packs" --silent; done
          sha256sum "$RUNNER_TEMP"/packs/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/build-output.tar
          archive: false
          if-no-files-found: error

  rehearse-publish:
    name: Rehearse publish (publish)
    needs: rehearse-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org/'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output.tar
          path: ${{ runner.temp }}/build-output
          skip-decompress: true
      - run: ls -la "$RUNNER_TEMP/build-output"
      - run: node scripts/unpack-build-output.mjs "$RUNNER_TEMP/build-output"
      - name: Backstop, as publish.yml runs it
        run: |
          fail=0
          if ! git diff --exit-code --stat; then
            echo "::error::unpacking changed tracked files"
            fail=1
          fi
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            echo "::error::unpacking added files outside the build output: $untracked"
            fail=1
          fi
          stray=$(git ls-files --others --ignored --exclude-standard | grep -v -E '^packages/[^/]+/(dist|registry)/' || true)
          if [ -n "$stray" ]; then
            echo "::error::ignored files outside the build output: $stray"
            fail=1
          fi
          exit $fail
      - name: Pack hashes as unpacked
        run: |
          for d in packages/*/; do pnpm -C "$d" pack --pack-destination "$RUNNER_TEMP/packs" --silent; done
          sha256sum "$RUNNER_TEMP"/packs/*.tgz
      - run: pnpm -r publish --dry-run --force --ignore-scripts --no-git-checks --tag latest
