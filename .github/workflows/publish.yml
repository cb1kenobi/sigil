name: Publish
on:
  release:
    types: [published]

# `pnpm -r publish` is what makes this a monorepo workflow rather than
# snooplogg's: `npm publish` does not understand the `workspace:` protocol and
# would publish a manifest declaring `@ttylabs/sigil: workspace:*`, which
# nobody can install. pnpm rewrites it to the version being published, walks
# the packages in dependency order so the runtime lands before the toolchain
# that depends on it, skips the two private members -- `website` and `demos`,
# the second of which is a workspace member so that the examples resolve
# `@ttylabs/sigil` by name without the root manifest declaring it -- and skips a
# version already on the registry, so re-running a release is a no-op rather
# than an error.
#
# It is two jobs, and the line between them is the npm token. `build` installs
# the workspace and runs `pnpm check`, `pnpm test` and `pnpm build`, which is
# every devDependency's code -- tsdown, rolldown, vitest, oxlint, turbo and what
# they pull in -- so it holds neither the token nor `id-token: write`. `publish`
# holds both and runs no package code at all: no `pnpm install`, and
# `--ignore-scripts` on the publish, because every package's `prepublishOnly` is
# `pnpm run build` and would otherwise rebuild everything with the token in the
# environment.
#
# What `publish` ships is what `build` built and tested, handed over as a
# workflow artifact rather than rebuilt: the build's outputs -- every
# `packages/*/dist` and `packages/sigil/registry`, which are turbo's `outputs`
# for `build` -- in one ustar archive. Everything else `pnpm -r publish` packs
# (manifests, READMEs, LICENSE files, the screenshot package's fonts) is
# tracked, and `publish` checks out the same commit. `pnpm pack` rewrites
# `workspace:*` from the workspace's own manifests, so none of it needs a
# `node_modules`.
#
# That archive is the one thing `build` hands `publish`, and `build` controls
# all of it: a compromised devDependency runs there with passwordless sudo, so
# it can write any archive it likes, member names and types included, and
# upload it under this artifact's name. Extracted blindly over the checkout it
# could replace the tracked `.npmrc`, a manifest or `pnpm-workspace.yaml`, and
# send the token wherever it chose. So `publish` never unzips or untars it with
# a tool: the artifact is one file uploaded unzipped and downloaded with
# `skip-decompress` into `$RUNNER_TEMP`, and `scripts/unpack-build-output.mjs`
# -- read from the checkout, not from the artifact -- parses it itself and
# writes only regular files and directories under `packages/<pkg>/dist` and
# `packages/<pkg>/registry`, refusing the whole archive if any member is
# anything else. A check after it fails the job if the checkout has changed in
# any other way. `publish` runs on a fresh runner, so the node and git it uses
# are not ones `build` could have touched.
#
# What the split protects is the token, and with it every package and version
# this release does not publish. What it cannot protect is this release's own
# `dist/` and `registry/` bytes: `build` produced them, so a compromised
# devDependency still decides what they contain. That is inherent in
# publishing what was built and tested.

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and test

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # This guard runs before the install, because it does not need it: it
      # reads `package.json` with `node`, and a release gets the tag wrong often
      # enough to be worth failing fast on. Paying for `pnpm install
      # --frozen-lockfile` before finding out the tag is mistyped is a minute
      # spent to learn something the checkout already knew.
      #
      # the release tag says one version and each manifest says its own, and
      # nothing else compares them -- so a release tagged v0.2.0 would happily
      # publish 0.0.1 and leave the notes describing a version that does not
      # exist. That is the hazard a single-package repo does not have, where
      # the version you can see in the release is the version that ships.
      #
      # All five published packages move together: the toolchain, the config
      # stores and the screenshot package depend on the runtime at the same
      # version, and lockstep is what one repository releasing them together
      # can afford. Versioning them independently means tagging
      # `@ttylabs/sigil@0.1.0` instead, and this check is where that decision
      # would be written.
      #
      # The tag arrives through `env` rather than as `${{ }}` in the script: an
      # expression is pasted into the script text before bash reads it, so a
      # tag holding a quote would be shell rather than a value.
      - name: Check the tag matches the packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          want="${tag#v}"
          fail=0
          for pkg in packages/*/package.json; do
            private=$(node -p "require('./$pkg').private === true")
            [ "$private" = "true" ] && continue
            name=$(node -p "require('./$pkg').name")
            have=$(node -p "require('./$pkg').version")
            if [ "$have" != "$want" ]; then
              echo "::error::$name is $have but the release is tagged $tag"
              fail=1
            else
              echo "$name $have matches $tag"
            fi
          done
          exit $fail

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # the lockfile rather than whatever resolves today: a publish is the one
      # run that must install exactly what was tested
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      # publishing is irreversible, so the suite runs here too rather than
      # trusting that the commit was green when it was merged
      - name: Test
        run: pnpm test

      # `--force`, because `pnpm test` has already built every package and
      # this would otherwise be a turbo cache hit, which restores outputs over
      # the directories without emptying them -- so anything the suite left in
      # a `dist/` would ship. Forced, each package's build runs and starts by
      # removing its own outputs, which is the clean build `prepublishOnly`
      # used to guarantee.
      - name: Build
        run: pnpm build --force

      # POSIX ustar, because that is the one format the unpacking script in
      # `publish` reads: regular files and directories, and nothing else.
      - name: Pack the build output
        run: tar --format=ustar -cf "$RUNNER_TEMP/build-output.tar" packages/*/dist packages/*/registry

      # `archive: false` uploads the file as it is rather than inside a zip,
      # so that `publish` can download it without unzipping anything.
      - name: Upload the build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/build-output.tar
          archive: false
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    name: Publish

    permissions:
      contents: read
      # npm provenance: attests that these files were built by this workflow
      # from this commit, which is the one claim a consumer cannot make for
      # themselves
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org/'

      # npm answers an unauthorized publish with `404 Not Found` rather than a
      # 401, deliberately, so that the registry does not confirm whether a
      # package exists -- and reaching that at the end of the run, after the
      # tarball has been built and its provenance signed, is the least
      # actionable place to learn it. This says who the token is before any of
      # that. It runs after `build` now, because the token lives only in this
      # job; a bad token costs the build and the suite, and once the secret is
      # fixed, re-running the failed job publishes the artifact `build` already
      # made rather than building again.
      #
      # It is not a proof that the publish will work, and cannot be: a
      # **read-only** token answers `whoami` perfectly happily, and the only
      # thing that truly tests write access is a write. What it does catch is
      # a missing, malformed or expired token, and a token belonging to an
      # account nobody expected -- which is most of the ways this goes wrong.
      # The first failure it was written for was none of those: the org
      # existed and the account owned it, and the token was the wrong kind,
      # because a granular token can only name packages that already exist and
      # a first publish has none to name.
      - name: Check the token can publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          scope=$(node -p "require('./packages/sigil/package.json').name.split('/')[0]")
          if ! who=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN is not a valid npm token ($who)"
            exit 1
          fi
          echo "authenticated as $who"
          if npm access list packages "$scope" >/dev/null 2>&1; then
            echo "$who can see packages in $scope"
          else
            echo "::warning::$who cannot list packages in $scope. If the publish"
            echo "::warning::fails with 404, that is why: the org must exist and"
            echo "::warning::this account must have publish rights to it."
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Everything from here on handles what `build` produced, which is why the
      # token check above comes first: `npm whoami` reads a project `.npmrc`.
      #
      # Downloaded outside the checkout, and not decompressed: the artifact is
      # an uploaded file rather than a zip, and `skip-decompress` keeps it that
      # way even if what arrives under this name is a zip after all.
      - name: Download the build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output.tar
          path: ${{ runner.temp }}/build-output
          skip-decompress: true

      # The member filter: only regular files and directories under
      # `packages/<pkg>/dist` and `packages/<pkg>/registry`, or nothing at all.
      # See the script for exactly what it refuses.
      - name: Unpack the build output
        run: node scripts/unpack-build-output.mjs "$RUNNER_TEMP/build-output"

      # The backstop: whatever the filter let through, the checkout must be the
      # commit, plus ignored files under those output directories, and nothing
      # else -- no tracked file changed, nothing new and unignored, and nothing
      # ignored anywhere else. The lists are NUL-separated (`-z`) because git
      # otherwise quotes a name holding a non-ASCII character or a `"`, and a
      # quoted `"packages/sigil/dist/\303\251"` no longer starts with
      # `packages/`, so a legitimate output file would read as a stray.
      - name: Check the checkout holds nothing but build output
        run: |
          fail=0
          if ! git diff --exit-code --stat; then
            echo "::error::unpacking changed tracked files"
            fail=1
          fi
          untracked=$(git ls-files -z --others --exclude-standard | tr '\0' '\n')
          if [ -n "$untracked" ]; then
            echo "::error::unpacking added files outside the build output: $untracked"
            fail=1
          fi
          stray=$(git ls-files -z --others --ignored --exclude-standard | grep -zvE '^packages/[^/]+/(dist|registry)/' | tr '\0' '\n' || true)
          if [ -n "$stray" ]; then
            echo "::error::ignored files outside the build output: $stray"
            fail=1
          fi
          exit $fail

      # `prepublishOnly` used to rebuild each package on the way out, so a
      # missing `dist/` could not ship. With `--ignore-scripts` nothing does, so
      # this is that guarantee said directly: every path a published package
      # lists in `files` is on disk before anything is packed.
      - name: Check every published file is present
        run: |
          node -e '
            const { existsSync, readdirSync, readFileSync } = require("node:fs");
            for (const entry of readdirSync("packages", { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const dir = `packages/${entry.name}`;
              const pkg = JSON.parse(readFileSync(`${dir}/package.json`, "utf8"));
              if (pkg.private === true) continue;
              for (const file of pkg.files ?? []) {
                if (!existsSync(`${dir}/${file}`)) {
                  console.log(`::error::${pkg.name} publishes ${file}, and ${dir}/${file} is missing`);
                  process.exitCode = 1;
                }
              }
            }
          '

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: >
          pnpm -r publish
          --no-git-checks
          --ignore-scripts
          --provenance
          --tag "$DIST_TAG"
